<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRPG Notion Converter</title><style>body{font-family:system-ui,sans-serif;background:#f6f6f4;color:#222;margin:0}main{max-width:1000px;margin:40px auto;padding:0 18px}.panel{background:#fff;border:1px solid #ddd;border-radius:12px;padding:20px;margin:14px 0}h1{font-size:25px}h2{font-size:18px}.grid{display:grid;grid-template-columns:1fr 1.3fr;gap:14px}.muted{color:#777;font-size:13px}button,input,select{font:inherit}button{padding:8px 12px;margin:5px;border:1px solid #aaa;border-radius:7px;background:#fff;cursor:pointer}button:disabled{opacity:.4}input[type=file]{width:100%}.speaker{display:flex;gap:8px;align-items:center;margin:8px 0;padding:6px 0;border-bottom:1px solid #eee}.speaker span{flex:1;overflow-wrap:anywhere}.speaker input{width:60px}.preview{max-height:65vh;overflow:auto;line-height:1.8;white-space:pre-wrap}.preview h1{font-size:24px}.preview hr{border:0;border-top:1px solid #ddd}label{display:inline-flex;align-items:center;gap:5px;margin-right:12px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main><h1>로그 → 문서 변환기</h1><p class="muted">코코포리아 / Roll20 HTML → Notion Markdown. 파일은 서버로 전송되지 않습니다.</p><section class="panel"><h2>1. HTML 로그 업로드</h2><input type="file" id="files" accept=".html,.htm,text/html" multiple><p id="status" class="muted">파일을 선택하세요.</p></section><section class="panel"><h2>2. 설정</h2><label>제목 간격 <input id="interval" type="number" min="1" value="250" style="width:70px"></label><label><input id="divider" type="checkbox" checked> 제목 아래 구분선</label><p class="muted">개요 → 상세 내용 → 검토 사항 → 주요 내용 → 견해 → 참고 사항 → 추가 검토 → 종합 의견</p></section><div class="grid"><section class="panel"><h2>3. 화자 분류</h2><div id="speakers">파일을 업로드하면 표시됩니다.</div></section><section class="panel"><h2>4. 미리보기</h2><button id="download" disabled>Markdown 다운로드</button><button id="copy" disabled>복사</button><div class="preview" id="preview"></div></section></div></main><script>'use strict';const HEADINGS=['개요','상세 내용','검토 사항','주요 내용','견해','참고 사항','추가 검토','종합 의견'];const $=id=>document.getElementById(id);let messages=[],people=new Map();const txt=e=>(e?.textContent||'').replace(/\u00a0/g,' ').replace(/[ \t]+/g,' ').trim();const qs=(e,s)=>e?.querySelector(s);function initial(name){return name.trim().split(/\s+/).map(w=>{let c=w[0]||'X';if(/[a-z]/i.test(c))return c.toUpperCase();let x=c.charCodeAt(0);return x>=0xac00&&x<=0xd7a3?['G','K','N','D','T','R','M','B','P','S','J','C','K','T','P','H'][Math.floor((x-0xac00)/588)]:'X'}).join('')||'X'}function parse(html){const doc=new DOMParser().parseFromString(html,'text/html'),isRoll=/roll20|data-messageid/i.test(html),selectors=isRoll?'div.message':'div.message,.chat-message,.chat-log-item,.message-item,p',nodes=[...doc.querySelectorAll(selectors)].filter(e=>!e.closest('script,style')&&!e.parentElement?.closest('div.message,.chat-message,.chat-log-item,.message-item'));const out=[];for(const e of nodes){let name=txt(qs(e,'.name,.speaker,.sender,.character-name,.message-name,.by,.who,.message-sender,[data-speaker]'));let c=qs(e,'.message-content,.message-body,.content,.text,.body,.chat-message-text,.message-text,.tchat-text');let body=txt(c);if(!body){const clone=e.cloneNode(true);clone.querySelectorAll('.name,.speaker,.sender,.character-name,.message-name,.by,.who,.message-sender,time,.timestamp,img,script,style').forEach(x=>x.remove());body=txt(clone)}if(!name){const m=body.match(/^([^:：\n]{1,50})\s*[:：]\s*(.+)$/s);if(m){name=m[1].trim();body=m[2].trim()}}if(!body||(!name&&body.length>2000))continue;const cls=typeof e.className==='string'?e.className:'';out.push({name,body,type:/rollresult|rolltemplate|dice/i.test(cls)||/CCB|\d+[dD]\d+|주사위|판정|성공|실패/i.test(body)?'dice':'text'})}return out}function role(n){return !n||/^(GM|KP|KPC|Keeper|Narrator|나레이션|서술|지문|System|시스템)$/i.test(n)?'narration':'pc'}function refreshPeople(){people=new Map();for(const m of messages)if(!people.has(m.name))people.set(m.name,{role:role(m.name),alias:initial(m.name||'X')});const used=new Set();for(const p of people.values()){if(p.role==='pc'){let base=p.alias,i=2;while(used.has(p.alias))p.alias=base+i++;used.add(p.alias)}}const el=$('speakers');el.replaceChildren();for(const [name,p]of people){let row=document.createElement('div');row.className='speaker';let title=document.createElement('span');title.textContent=name||'(이름 없음)';let select=document.createElement('select');for(const [v,label]of [['pc','PC'],['npc','NPC'],['narration','나레이션'],['system','시스템']])select.add(new Option(label,v));select.value=p.role;select.onchange=()=>{p.role=select.value;render()};let input=document.createElement('input');input.value=p.alias;input.oninput=()=>{p.alias=input.value.toUpperCase().replace(/[^A-Z0-9]/g,'')||'X';render()};row.append(title,select,input);el.append(row)}}function esc(s){return s.replace(/\\/g,'\\\\').replace(/([*_`\[\]])/g,'\\$1').replace(/^([#>])/gm,'\\$1')}function build(){let out=[],last='',count=0,section=0,limit=Math.max(1,+$('interval').value||250);function head(){out.push('# '+HEADINGS[section%HEADINGS.length]);if($('divider').checked)out.push('','---');out.push('')}head();for(const m of messages){const p=people.get(m.name)||{role:'narration',alias:'X'},key=m.name; if(count>=limit&&key!==last){section++;head();count=0;last=''}const body=esc(m.body).replace(/\s*\n\s*/g,' ');if(p.role==='pc'){if(m.type==='dice')out.push('  - '+body);else if(last===key)out.push('- '+body);else out.push('',p.alias+' : '+body)}else if(p.role==='npc')out.push('- '+body);else if(p.role==='narration'&&last===key&&out.length)out[out.length-1]+=' '+body;else out.push('',body);last=key;count++}return out.join('\n').replace(/\n{3,}/g,'\n\n').trim()+'\n'}function render(){const md=build(),el=$('preview');el.replaceChildren();for(const line of md.split('\n')){if(!line.trim())continue;let tag=line.startsWith('# ')?'h1':line==='---'?'hr':'p',node=document.createElement(tag);if(tag==='h1')node.textContent=line.slice(2);else if(tag==='p')node.textContent=line;el.append(node)}$('download').disabled=$('copy').disabled=!messages.length}function save(text){let u=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='notion-log.md';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}$('files').onchange=async e=>{messages=[];let names=[];for(const f of e.target.files){if(!/\.html?$/i.test(f.name))continue;let arr=parse(await f.text());messages.push(...arr);names.push(f.name+' ('+arr.length+'건)')}$('status').textContent=names.join(' / ')||'읽을 수 있는 HTML 파일이 없습니다.';refreshPeople();render()};$('interval').oninput=render;$('divider').onchange=render;$('download').onclick=()=>save(build());$('copy').onclick=()=>navigator.clipboard.writeText(build()).catch(()=>alert('복사 권한이 없어 다운로드를 사용하세요.'));</script></body></html>
